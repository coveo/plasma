name: Release PR

on:
    push:
        branches:
            - master

permissions:
    contents: write
    pull-requests: write

jobs:
    release-pr:
        name: Create Or Update Release PR
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
            - uses: ./.github/actions/setup
            - name: Create or update the Changesets release PR
              uses: step-security/changeset-action@6ddf46283ed49170eb6ca2179818f7d2a0ae687c # v1.9.0
              with:
                  commit: 'chore(release): version packages'
                  title: 'chore(release): version packages'
                  version: pnpm changeset:version
                  commitMode: github-api
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    trigger-cd:
        name: Trigger CD After Release PR Merge
        # Cheap pre-filter so ordinary merges don't start a runner; contains() is case-insensitive.
        if: contains(github.event.head_commit.message, 'version packages')
        runs-on: ubuntu-latest
        permissions:
            actions: write
            contents: read
            pull-requests: read
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit

            # CD stays dispatch-only rather than running on every push: its branch-wide concurrency group would let
            # ordinary merges cancel an in-flight publish, and the Chromatic "release" branch must only move on releases.
            # Dispatching with GITHUB_TOKEN is allowed (workflow_dispatch is exempt from the no-trigger rule).
            - name: Dispatch CD when the pushed commit comes from the release PR
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  release_pr=$(gh api "repos/{owner}/{repo}/commits/$GITHUB_SHA/pulls" --jq '
                      map(select(
                          .merged_at != null
                          and .base.ref == "master"
                          and .head.repo.full_name == $ENV.GH_REPO
                          and (.head.ref | startswith("changeset-release/"))
                      ))[0].number // empty')

                  if [ -z "$release_pr" ]; then
                    echo "Commit $GITHUB_SHA does not come from a release PR, skipping CD"
                    exit 0
                  fi

                  echo "Commit $GITHUB_SHA merged release PR #$release_pr, dispatching CD on master"
                  gh workflow run cd.yml --ref master
