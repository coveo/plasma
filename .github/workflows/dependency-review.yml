name: 'Dependency Review'

on:
    pull_request:
        branches: ['master', next]

permissions:
    contents: read
    pull-requests: write

jobs:
    dependency-Review:
        name: Review
        uses: coveo/public-actions/.github/workflows/dependency-review.yml@230871ba17b7387ca26fd3a2ce5c409f657880cf # main
        with:
            public: true
            distributed: true
            runs-on: '["ubuntu-latest"]'
